# Netlify: Website unter /, Lernplattform unter /app/
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# /app ohne Schrägstrich → /app/
[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301

# Seiten nie aus dem Browser-Cache: neue Versionen sofort sichtbar (Bilder/Skripte mit Hash dürfen lange gecacht werden)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/app/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Bilder, Schriften und Video lange cachen (Dateinamen ändern sich bei neuen Versionen selten; 1 Woche)
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Sicherheits-Header
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
